name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: PT-Meeting-Sampai-Malam-Konsultasi/rusuh-infra/.github/workflows/backend-ci.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      service: msmk-queue
      runtime: go
      runtime-version-file: go.mod
      format: make fmt-check
      lint: |
        go vet ./...
        make lint
      vuln: make vuln
      test: make test-cover
      # G404: math/rand only jitters retry hints and stream lifetimes; nothing secret is drawn from it
      sast: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet -severity high -exclude-dir=_mock -exclude=G404 ./...
      coverage: make cover
      extra: |
        make sqlc
        git diff --exit-code -- internal/

  sonar:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: coverage
        if: env.SONAR_TOKEN != ''
        run: go test -p 2 -coverprofile=coverage.out ./...
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
      - if: env.SONAR_TOKEN == ''
        run: echo "SonarQube Cloud scan skipped; SONAR_TOKEN is not set" >> "$GITHUB_STEP_SUMMARY"

  cd:
    needs: ci
    if: github.ref_type == 'tag'
    uses: PT-Meeting-Sampai-Malam-Konsultasi/rusuh-infra/.github/workflows/backend-cd.yml@v1
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      service: msmk-queue
      environment: production
