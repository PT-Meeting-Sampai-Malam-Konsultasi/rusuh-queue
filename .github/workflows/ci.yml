name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    # TODO(CICD-01): move to @v1 once rusuh-infra#5 is merged and tagged
    uses: PT-Meeting-Sampai-Malam-Konsultasi/rusuh-infra/.github/workflows/backend-ci.yml@feature/shared-ci-cd
    permissions:
      contents: read
      packages: write
    with:
      service: rusuh-queue
      runtime: go
      runtime-version-file: go.mod
      format: make fmt-check
      lint: |
        go vet ./...
        make lint
      vuln: make vuln
      test: make test-cover
      # G404: math/rand only jitters retry hints and stream lifetimes; nothing secret is drawn from it
      sast: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet -severity high -exclude-dir=_mock -exclude=G404 ./...
      coverage: make cover
      extra: |
        make sqlc
        git diff --exit-code -- internal/

  cd:
    needs: ci
    if: github.ref_type == 'tag'
    uses: PT-Meeting-Sampai-Malam-Konsultasi/rusuh-infra/.github/workflows/backend-cd.yml@feature/shared-ci-cd
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      service: rusuh-queue
      environment: production
