sonar.organization=pt-meeting-sampai-malam-konsultasi
sonar.projectKey=PT-Meeting-Sampai-Malam-Konsultasi_rusuh-queue
sonar.projectName=rusuh-queue

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Generated code is not analysed at all; entry points and test helpers are analysed but, as in `make cover`, not counted for coverage.
sonar.exclusions=**/*_test.go,_mock/**,api/*.gen.go,**/sqlcgen/**,bin/**,docs/**
sonar.coverage.exclusions=cmd/**,internal/testkit/**

sonar.go.coverage.reportPaths=coverage.out
